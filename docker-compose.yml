# Backend of the site for development and staging: PostgreSQL, migrations, API, queue worker and Mailpit,
# which catches every letter (http://127.0.0.1:8025). The storefront runs with `npm run dev`; it proxies
# /api/v1/* to the API (next.config.ts, API_ORIGIN). Settings: copy .env.example to .env.
name: ogk-site

services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-site}
      POSTGRES_DB: site
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &database
      DATABASE_URL: postgresql+psycopg://site:${POSTGRES_PASSWORD:-site}@db:5432/site
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment: *database
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "app.outbox.worker"]
    env_file: .env
    environment: *database
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db:
  files:
