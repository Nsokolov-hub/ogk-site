name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: site_test
          POSTGRES_PASSWORD: site_test_password
          POSTGRES_DB: site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_URL: postgresql+psycopg://site_test:site_test_password@localhost:5432/site_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-dev.lock
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app tests
      - name: Tests on SQLite
        env:
          DATABASE_URL: sqlite://
        run: pytest -q -p no:cacheprovider
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests on PostgreSQL
        env:
          DATABASE_URL: sqlite://
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ogk-site-backend:ci backend
      - name: Smoke-test backend image
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:// ogk-site-backend:ci python -c
          "import app.main, app.outbox.worker, app.cli"
