name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (NFR-04)
        run: npm audit --omit=dev
      - name: API types match backend/openapi.json
        run: npm run api:types:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  # The admin panel (admin/, TZ 13): audit, types, production build.
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Audit production dependencies (NFR-04)
        run: npm audit --omit=dev
      - name: TypeScript and build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: site_test
          POSTGRES_PASSWORD: site_test_password
          POSTGRES_DB: site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        # Same version as docker-compose.yml: search tests run on the real engine (TZ 6 control examples).
        image: getmeili/meilisearch:v1.54.3
        env:
          MEILI_MASTER_KEY: ci-master-key-0123456789
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    env:
      PG_URL: postgresql+psycopg://site_test:site_test_password@localhost:5432/site_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-dev.lock
      - name: Audit dependencies (NFR-04)
        # The development lock holds every runtime pin as well.
        run: pip-audit -r requirements-dev.lock
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app tests
      - name: backend/openapi.json matches the code
        run: python scripts/export_openapi.py --check
      - name: Tests on SQLite
        env:
          DATABASE_URL: sqlite://
        run: pytest -q -p no:cacheprovider
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests on PostgreSQL and Meilisearch
        env:
          DATABASE_URL: sqlite://
          TEST_DATABASE_URL: ${{ env.PG_URL }}
          TEST_MEILI_URL: http://localhost:7700
          TEST_MEILI_KEY: ci-master-key-0123456789
        run: pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ogk-site-backend:ci backend
      - name: Smoke-test backend image
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:// ogk-site-backend:ci python -c
          "import app.main, app.outbox.worker, app.cli, app.catalog.cli, rdkit, boto3, redis, sentry_sdk"
      # Staging and production (deploy/README.md): the compose files merge and both Caddyfiles are valid.
      - name: Staging and production configuration
        run: |
          cp .env.example .env
          for mode in staging production; do
            SITE_ENV=$mode SITE_DOMAIN=www.example.ru ADMIN_DOMAIN=admin.example.ru TLS_EMAIL=ci@example.ru \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
            docker run --rm -e SITE_DOMAIN=www.example.ru -e ADMIN_DOMAIN=admin.example.ru -e TLS_EMAIL=ci@example.ru -e STAGING_USER=ogk \
              -e 'STAGING_PASSWORD_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4wHAiSgLiAy' \
              -v "$PWD/deploy/Caddyfile.$mode:/etc/caddy/Caddyfile:ro" -v "$PWD/deploy/caddy:/etc/caddy/conf:ro" \
              caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          bash -n scripts/deploy.sh scripts/backup.sh scripts/restore.sh scripts/lib.sh

  # SC-01…SC-04 (NFR-12) on the whole site in Docker with the test catalog.
  e2e:
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the site
        run: |
          cp .env.example .env
          echo "REVALIDATE_SECRET=ci-revalidate-secret" >> .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:8001/ready
      - name: Load the test catalog
        run: docker compose exec -T api python -m app.catalog.cli seed
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Browser for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end scenarios
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Logs of the site
        if: failure()
        run: docker compose logs --no-color --tail 200 api worker web
